version: '3.9'

services:
  database:
    image: postgres:16.1-alpine3.18
    container_name: ai-pr-reviewer-database
    restart: always
    ports:
      - ${DB_FORWARD_PORT:-5432}:5432
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-admin}
      - POSTGRES_DB=${DB_DATABASE:-preview_intel}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - ai_pr_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: ai-pr-reviewer-pgadmin
    restart: always
    ports:
      - ${PGADMIN_FORWARD_PORT:-8888}:80
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - ai_pr_network

  redis:
    image: redis:7-alpine
    container_name: ai-pr-reviewer-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai_pr_network

  # Backend service
  backend:
    container_name: ai-pr-reviewer-backend
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    ports:
      - ${APP_FORWARD_PORT:-8080}:${APP_PORT:-8080}
    volumes:
      - .:/app
    networks:
      - ai_pr_network
    restart: on-failure
    tty: true
    stdin_open: true
    expose:
      - ${APP_PORT:-8080}

networks:
  ai_pr_network:
    name: ai-pr-shared-network
    external: true
volumes:
  pg_data:
  redis_data:
  pgadmin_data: {}